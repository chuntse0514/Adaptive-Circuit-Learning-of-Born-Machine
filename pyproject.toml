[project]
name = "qdataloading"
version = "0.1.0"
description = "Adaptive Circuit Learning of Born Machine for Quantum Data Loading"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "pennylane>=0.30.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "optax>=0.1.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0"
]
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
ignore = []
